# child-exp004: A4 LoRA r=64 ablation（OOM 回避版）
# vs child-exp002: bs=2→1, grad_accum=16→32 のみ変更（effective bs=32 維持）
# child-exp002 が RTX Pro 6000 で OOM → bs を半減して activation メモリ削減
# target_modules, r=64, alpha=64 は child-exp001 との公正比較のため維持

lora:
  r: 64
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj
    - out_proj
    - up_proj
    - down_proj
    - lm_head

training:
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_length: 8192
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.0
  seed: 777
