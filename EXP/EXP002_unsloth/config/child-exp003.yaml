# child-exp003: B1 データ追加 ablation
# vs child-exp001: ハイパラ同一、Tong CoT + konbu17 CoT をミックス (~14k rows)
# 狙い: 同一問題に複数 CoT を学習させて maj@64 のロバスト性向上
# data.path を変更するのみ、その他は child-exp001 を完全継承

data:
  path: /kaggle/input/nemotron-merged-cot-v1/merged_cot_v1.csv

lora:
  r: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj
    - out_proj
    - up_proj
    - down_proj
    - lm_head

training:
  num_train_epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16  # effective batch = 32
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_length: 8192
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.0
  seed: 777
