# child-exp005: r=64 ablation（epoch=1 短縮版）
# vs child-exp004: num_train_epochs=2→1 のみ変更（タイムアウト回避）
# 目的: r=64 の有効性を方向確認（child-exp000: r=32, epoch=1, LB=0.84 との比較）

lora:
  r: 64
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - in_proj
    - out_proj
    - up_proj
    - down_proj
    - lm_head

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  max_length: 8192
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.0
  seed: 777
